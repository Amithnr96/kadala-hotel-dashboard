<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Kadala Hotel</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f2ed;color:#2c211a;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#fff;border:1px solid #e7ddd4;border-radius:18px;padding:28px;width:100%;max-width:440px;box-shadow:0 8px 24px #462d2814}h1{font-size:24px;margin-top:0}p{color:#7b6d63;line-height:1.5}label{display:block;margin:16px 0 5px;font-weight:600}input,button{font:inherit;width:100%;padding:12px;border:1px solid #d8c8bb;border-radius:9px}button{margin-top:22px;background:#7c2d12;color:white;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#message{color:#b42318;min-height:24px}a{color:#7c2d12}[hidden]{display:none!important}
</style><script src="/auth.js" defer></script></head><body><main class="card"><h1>Kadala Hotel</h1><h2 id="title">Sign in</h2><p id="help">Use your owner or staff account to access the shared hotel records.</p><form id="authForm"><div id="usernameField"><label for="username">Username</label><input id="username" autocomplete="username" required minlength="3" maxlength="50" pattern="[a-zA-Z0-9][a-zA-Z0-9_.-]{2,49}"></div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><div id="confirmField" hidden><label for="confirmation">Confirm password</label><input id="confirmation" type="password" autocomplete="new-password" maxlength="128"></div><button id="submit" type="submit">Sign in</button><p id="message" role="alert"></p></form><a id="loginLink" href="/login" hidden>Back to sign in</a><p>Ask the owner for an invitation or a staff password reset.</p></main></body></html>
