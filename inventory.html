<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory · Kadala Hotel</title><style>
:root{--brand:#7c2d12;--line:#e7ddd4}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f6f2ed;color:#2c211a;font-family:system-ui,sans-serif}.app{max-width:1100px;margin:auto;padding:18px 12px 70px}h1{font-size:24px;margin:0}h2{font-size:19px}.sub{color:#7b6d63;font-size:13px;margin:6px 0 18px}.tabs,.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;align-items:center}.tabs a,.tabs strong,button{font:inherit;border:1px solid var(--line);border-radius:9px;background:white;padding:10px 14px;color:var(--brand);text-decoration:none;cursor:pointer}.tabs strong,.primary{background:var(--brand);color:white}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 8px 24px #462d2810}label{font-size:12px;color:#7b6d63;font-weight:600;display:block}input,select{font:inherit;width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px;background:white;color:#2c211a}.stock-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin:12px 0;padding-bottom:12px;border-bottom:1px solid var(--line)}.stock-row label input,.stock-row label select{margin-top:5px}.item{font-weight:700;padding:12px 0}.date{max-width:200px}.error{color:#b42318}.success{color:#157347}button:disabled{opacity:.5;cursor:wait}#message{min-height:24px}a{color:var(--brand)}@media(max-width:650px){.stock-row{grid-template-columns:1fr 1fr}.stock-row>label:first-child,.stock-row>.item{grid-column:span 2}.stock-row button{grid-column:span 2}.stock-row .unit{grid-column:span 2}}
</style><script src="/inventory.js" defer></script></head><body><main class="app"><h1>Kadala Hotel Inventory</h1><p class="sub">Daily opening and closing stock, shared across your team.</p><div class="toolbar"><span id="account"></span><button id="signout">Sign out</button></div><nav class="tabs"><a id="dashboardLink" href="/" hidden>Dashboard</a><strong>Inventory</strong><a id="manageLink" href="/accounts" hidden>Manage staff</a></nav><p id="message" role="status">Loading inventory…</p><form id="inventoryForm" hidden><div class="toolbar"><label class="date">Date<input id="stockDate" type="date" required></label><button id="stockToday" type="button">Today</button><button id="reloadStock" type="button">Reload saved stock</button></div><section class="card"><h2>Meat</h2><div id="meatRows"></div></section><section class="card"><h2>Custom</h2><div id="customRows"></div><button id="addStock" type="button">+ Add custom item</button></section><p class="sub">Enter quantities in the selected unit. Leave a stock field blank until counted. Closing stock can exceed opening stock when supplies arrive.</p><div class="toolbar"><button class="primary" id="saveStock" type="submit">Save inventory</button><button id="downloadStock" type="button">Download this day's stock</button></div></form></main></body></html>
