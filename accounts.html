<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff accounts · Kadala Hotel</title><style>body{font-family:system-ui,sans-serif;background:#f6f2ed;color:#2c211a;margin:0;padding:20px}main{max-width:760px;margin:auto}section{background:#fff;border:1px solid #e7ddd4;border-radius:14px;padding:22px;margin:18px 0}input,button{font:inherit;padding:10px;border:1px solid #d8c8bb;border-radius:8px}input{max-width:100%;box-sizing:border-box}button{background:#7c2d12;color:white;cursor:pointer;margin:4px}a{color:#7c2d12}label{display:block;margin:10px 0}li{margin:15px 0;list-style:none;border-bottom:1px solid #eee;padding-bottom:10px}ul{padding:0}#inviteUrl{width:100%}#message{color:#b42318}[hidden]{display:none!important}</style><script src="/accounts.js" type="module"></script></head><body><main><a href="/">← Dashboard</a><h1>Staff accounts</h1><p>Staff can view and edit hotel records. Only the owner can manage accounts and import backups.</p><section><form id="addStaff"><label for="username">New staff username</label><input id="username" required minlength="3" maxlength="50" pattern="[a-zA-Z0-9][a-zA-Z0-9_.-]{2,49}" autocomplete="off"><button>Create invitation</button></form><div id="invite" hidden><p>Share this private link directly with the staff member. It expires in 24 hours and works once. They choose their own password.</p><input id="inviteUrl" readonly aria-label="Staff invitation link"><button id="copyInvite">Copy invitation</button></div></section><section><h2>Accounts</h2><ul id="users"></ul></section><p id="message" role="status"></p></main></body></html>
